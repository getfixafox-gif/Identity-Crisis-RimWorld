name: Build

# Compiles IdentityCrisis.dll, runs the static checks from .github/scripts/check_mod.py
# and uploads a ready-to-install mod folder. On pull requests the results are posted
# as a single comment that is updated on every push.

on:
  push:
    branches: [main, 'integration/**', 'beta/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static checks
        id: checks
        continue-on-error: true
        shell: bash
        run: python3 .github/scripts/check_mod.py 2>&1 | tee checks.log

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build IdentityCrisis.dll
        id: build
        continue-on-error: true
        shell: bash
        run: dotnet build Source/IdentityCrisis/IdentityCrisis.csproj -c Release -nologo 2>&1 | tee build.log

      - name: Package the mod folder
        id: package
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          out=dist/IdentityCrisis
          mkdir -p "$out"
          for item in About Defs Languages Patches Textures 1.6 LoadFolders.xml README.md CHANGELOG.md; do
            if [ -e "$item" ]; then cp -r "$item" "$out/"; fi
          done
          if [ ! -f "$out/1.6/Assemblies/IdentityCrisis.dll" ]; then
            dll=$(find Source 1.6 -name IdentityCrisis.dll -path '*Release*' 2>/dev/null | head -n 1 || true)
            if [ -z "$dll" ]; then dll=$(find . -path ./dist -prune -o -name IdentityCrisis.dll -print | head -n 1); fi
            test -n "$dll"
            mkdir -p "$out/1.6/Assemblies"
            cp "$dll" "$out/1.6/Assemblies/"
          fi
          find dist -type f | sort | head -n 200

      - name: Upload the mod
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: IdentityCrisis-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/
          retention-days: 30

      - name: Report to the pull request
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          CHECKS_OUTCOME: ${{ steps.checks.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
        with:
          script: |
            const fs = require('fs');
            const read = (f) => (fs.existsSync(f) ? fs.readFileSync(f, 'utf8') : '');
            const uniq = (a) => [...new Set(a)];
            const icon = (s) => (s === 'success' ? '✅' : !s || s === 'skipped' ? '⏭️' : '❌');
            const checkLines = read('checks.log').split('\n').filter((l) => /^(error|warning):/.test(l));
            const buildLines = uniq(read('build.log').split('\n')
              .filter((l) => /: (error|warning) [A-Z]+[0-9]+:/.test(l))
              .map((l) => l.replace(/^.*?(Source\/)/, '$1').replace(/\s*\[[^\]]*\.csproj\]\s*$/, '').trim()));
            const buildErrors = buildLines.filter((l) => /: error /.test(l));
            const buildWarnings = buildLines.filter((l) => /: warning /.test(l));
            const sha = context.payload.pull_request.head.sha;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const block = (lines, limit) => '```\n' + lines.slice(0, limit).join('\n')
              + (lines.length > limit ? `\n… и ещё ${lines.length - limit}` : '') + '\n```';
            let body = '<!-- ic-build-report -->\n';
            body += `### Сборка и проверки для \`${sha.slice(0, 7)}\`\n\n`;
            body += '| Шаг | Результат |\n|---|---|\n';
            body += `| Статические проверки (XML, переводы, Defs, текстуры) | ${icon(process.env.CHECKS_OUTCOME)} |\n`;
            body += `| Сборка \`IdentityCrisis.dll\` | ${icon(process.env.BUILD_OUTCOME)} |\n`;
            body += `| Готовая папка мода (артефакт) | ${icon(process.env.PACKAGE_OUTCOME)} |\n\n`;
            if (buildErrors.length) body += `**Ошибки компиляции (${buildErrors.length}):**\n\n` + block(buildErrors, 60) + '\n\n';
            if (checkLines.length) body += `**Статические проверки (${checkLines.length}):**\n\n` + block(checkLines, 60) + '\n\n';
            if (buildWarnings.length) body += `<details><summary>Предупреждения компилятора (${buildWarnings.length})</summary>\n\n`
              + block(buildWarnings, 80) + '\n\n</details>\n\n';
            if (process.env.PACKAGE_OUTCOME === 'success') body += `Готовый мод лежит в разделе **Artifacts** [этого запуска](${runUrl}): распакуйте папку \`IdentityCrisis\` в \`RimWorld/Mods\`.\n\n`;
            body += `[Журнал запуска](${runUrl}). Сборка подтверждает только компиляцию: поведение в игре нужно проверять вручную.`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const mine = comments.find((c) => c.user && c.user.type === 'Bot' && (c.body || '').includes('<!-- ic-build-report -->'));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - name: Fail if a check or the build failed
        if: steps.checks.outcome != 'success' || steps.build.outcome != 'success'
        shell: bash
        run: |
          echo "checks: ${{ steps.checks.outcome }}, build: ${{ steps.build.outcome }}"
          exit 1
